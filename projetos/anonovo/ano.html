<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contagem Regressiva para o Ano Novo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600&display=swap" rel="stylesheet"><script src="https://unpkg.com/fireworks-js@2.x/dist/index.umd.js"></script><style>:root{--accent-color:#d4af37;--accent-glow:rgba(212,175,55,0.5);--text-main:#fff;--text-secondary:hsla(0,0%,100%,0.6);--bg-color:#050505;--card-bg:rgba(20,20,20,0.3);--card-border:rgba(212,175,55,0.15)}*{user-select:none;-webkit-user-select:none;box-sizing:border-box}body,html{margin:0;padding:0;display:flex;justify-content:center;align-items:center;background-color:var(--bg-color);color:var(--text-main);font-family:Inter,sans-serif;overflow:hidden}#bg-canvas,body,html{height:100%;width:100%}#bg-canvas{position:absolute;top:0;left:0;z-index:0;pointer-events:none}.container{position:relative;text-align:center;z-index:2;width:95%;max-width:1000px;padding:20px}.header{font-size:clamp(.8rem,4vw,1.2rem);letter-spacing:clamp(.2rem,2vw,.5rem);color:var(--accent-color);margin-bottom:clamp(30px,8vh,50px);text-transform:uppercase;font-weight:300;text-shadow:0 0 15px var(--accent-glow)}.countdown-grid{display:flex;justify-content:center;align-items:center;gap:15px;margin-bottom:clamp(30px,8vh,60px);flex-wrap:nowrap}.time-unit{background:var(--card-bg);border:1px solid var(--card-border);padding:clamp(15px,4vw,30px) clamp(10px,2vw,20px);border-radius:1em;flex:1;min-width:0;max-width:160px;backdrop-filter:blur(4px) saturate(163%);-webkit-backdrop-filter:blur(4px) saturate(163%);box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .4s cubic-bezier(.175,.885,.32,1.275),border-color .3s}.time-unit:hover{transform:translateY(-5px);border-color:var(--accent-color)}.number{font-size:clamp(1.8rem,8vw,4.5rem);font-weight:200;line-height:1;margin-bottom:8px;color:var(--text-main);font-variant-numeric:tabular-nums}.label{font-size:clamp(.6rem,2vw,.75rem);color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;font-weight:600}.separator{font-size:clamp(1.5rem,5vw,2.5rem);color:var(--accent-color);opacity:.3;font-weight:100;margin-top:-15px}.progress-wrapper{width:100%;max-width:700px;padding:0 10px;margin:0 auto 20px}.progress-info{display:flex;justify-content:space-between;margin-bottom:12px;font-size:clamp(.7rem,2vw,.8rem);color:var(--text-secondary);letter-spacing:1px}.progress-container{width:100%;height:4px;background:hsla(0,0%,100%,.05);border-radius:10px;overflow:hidden;border:1px solid hsla(0,0%,100%,.03)}.progress-bar{height:100%;background:linear-gradient(90deg,#8a6d3b,#d4af37,#fcf6ba,#d4af37,#8a6d3b);background-size:200% 100%;width:0;box-shadow:0 0 15px var(--accent-glow);animation:gradientShift 5s linear infinite;transition:width 1s ease-in-out}#version{font-size:.7rem;color:var(--text-secondary);opacity:.5;letter-spacing:1px}@keyframes gradientShift{0%{background-position:0 50%}to{background-position:200% 50%}}@media (max-width:600px){.countdown-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.separator{display:none}.time-unit{max-width:none;padding:20px 10px}.container{padding:10px}}</style></head><body><canvas id="bg-canvas"></canvas><div class="container"><div class="header" id="main-header">Contagem Regressiva</div><div class="countdown-grid"><div class="time-unit"><div class="number" id="days">00</div><div class="label">Dias</div></div><div class="separator">:</div><div class="time-unit"><div class="number" id="hours">00</div><div class="label">Horas</div></div><div class="separator">:</div><div class="time-unit"><div class="number" id="minutes">00</div><div class="label">Minutos</div></div><div class="separator">:</div><div class="time-unit"><div class="number" id="seconds">00</div><div class="label">Segundos</div></div></div><div class="progress-wrapper"><div class="progress-info"><span id="label-cl">Ano Concluído</span><span id="progress-text">0.00%</span></div><div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div></div><div id="version"><b>by joaolucas1682 | versão 1.0.1 (20260301 YYYYMMDD)</b></div></div><script>const DEBUG_MODE=!1;let testTargetDate,fireworksInstance,isFinished=!1;const canvas=document.getElementById("bg-canvas"),ctx=canvas.getContext("2d");let particles=[];function initCanvas(){canvas.width=window.innerWidth,canvas.height=window.innerHeight}class Particle{constructor(){this.reset()}reset(){this.x=Math.random()*canvas.width,this.y=Math.random()*canvas.height,this.size=2*Math.random()+.5,this.speedX=.4*Math.random()-.2,this.speedY=.4*Math.random()-.2,this.opacity=.5*Math.random()+.1}update(){this.x+=this.speedX,this.y+=this.speedY,(this.x<-10||this.x>canvas.width+10||this.y<-10||this.y>canvas.height+10)&&this.reset()}draw(){ctx.fillStyle=`rgba(212, 175, 55, ${this.opacity})`,ctx.beginPath(),ctx.arc(this.x,this.y,this.size,0,2*Math.PI),ctx.fill()}}function createParticles(){const t=Math.floor(canvas.width*canvas.height/12e3);particles=[];for(let e=0;e<t;e++)particles.push(new Particle)}function animateParticles(){isFinished||(ctx.clearRect(0,0,canvas.width,canvas.height),particles.forEach((t=>{t.update(),t.draw()})),requestAnimationFrame(animateParticles))}function startFireworks(){fireworksInstance||(fireworksInstance=new Fireworks.Fireworks(canvas,{autoresize:!0,opacity:.5,acceleration:1.05,friction:.97,gravity:1.5,particles:50,traceLength:3,traceSpeed:10,explosion:5,intensity:30,flicker:50,lineStyle:"round",hue:{min:0,max:360},delay:{min:30,max:60},play:!0,sound:{enabled:!1}}),fireworksInstance.start())}function updateCountdown(){const t=new Date,e=t.getFullYear(),n=e+1;let a;a=new Date(`January 1, ${n} 00:00:00`).getTime();const i=new Date(`January 1, ${e} 00:00:00`).getTime(),s=t.getTime(),r=a-s;if(r<=0)return isFinished||(isFinished=!0,startFireworks()),document.getElementById("main-header").textContent=`FELIZ ${n}!`,document.querySelectorAll(".number").forEach((t=>t.textContent="00")),document.getElementById("progress-bar").style.width="100%",void(document.getElementById("progress-text").textContent="100.00%");const o=Math.floor(r/864e5),c=Math.floor(r%864e5/36e5),d=Math.floor(r%36e5/6e4),h=Math.floor(r%6e4/1e3);document.getElementById("days").textContent=String(o).padStart(2,"0"),document.getElementById("hours").textContent=String(c).padStart(2,"0"),document.getElementById("minutes").textContent=String(d).padStart(2,"0"),document.getElementById("seconds").textContent=String(h).padStart(2,"0");const l=(s-i)/(a-i)*100;document.getElementById("progress-bar").style.width=Math.min(l,100).toFixed(4)+"%",document.getElementById("progress-text").textContent=Math.min(l,100).toFixed(2)+"%",document.getElementById("main-header").textContent=`Contagem para ${n}`}window.addEventListener("resize",(()=>{initCanvas(),isFinished||createParticles()})),window.onload=()=>{initCanvas(),createParticles(),animateParticles(),setInterval(updateCountdown,1e3),updateCountdown()};</script></body></html>

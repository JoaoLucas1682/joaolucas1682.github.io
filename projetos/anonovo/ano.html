<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contagem Regressiva - Ano Novo</title><link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&display=swap&text=1234567890:.dhm" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,Arial,sans-serif;text-align:center;background-color:#000;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;user-select:none}#bgCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;filter:blur(2px) brightness(1);transition:filter 1s ease-in-out}body.celebrating #bgCanvas{filter:blur(12px) brightness(.6)}.content{position:relative;z-index:2;width:100%;max-width:900px;padding:20px;pointer-events:none}.content a,.content button,.modal{pointer-events:auto}.pop-in{animation:popIn .8s cubic-bezier(.175,.885,.32,1.275) forwards}@keyframes popIn{0%{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}h1{font-size:clamp(2.5rem,8vw,5rem);font-weight:900;margin-bottom:.5rem}#countdown{font-family:Roboto Mono,monospace;font-weight:700;font-size:clamp(1.8rem,8vw,4.5rem);color:transparent;-webkit-text-stroke:2px red;animation:outlineColor 3s linear infinite;white-space:nowrap}@keyframes outlineColor{0%{-webkit-text-stroke:2px red}33%{-webkit-text-stroke:2px #ff0}66%{-webkit-text-stroke:2px #0ff}to{-webkit-text-stroke:2px red}}#countdown:after{content:attr(data-ms);font-size:.5em;color:#4b92f3;-webkit-text-stroke:0;margin-left:5px}#subTitle{font-size:clamp(1.2rem,4vw,1.8rem);margin-top:1rem;color:#fff;max-width:800px;margin-left:auto;margin-right:auto;transition:all .5s ease}.celebration-active h1{color:gold!important;text-shadow:0 0 30px gold,0 0 50px orange}.celebration-active #subTitle{color:#4b92f3;font-weight:700}.modal{display:none;position:fixed;z-index:1000;inset:0;background-color:rgba(0,0,0,.9);backdrop-filter:blur(10px)}.modal-content{background:#111;padding:30px;border-radius:15px;width:90%;max-width:400px;margin:10vh auto;border:1px solid #333}.btn{padding:12px;border-radius:8px;border:none;cursor:pointer;color:#fff;font-weight:700;width:100%;margin-top:10px;font-size:.9rem}.btn-blue{background:#3b82f6}.btn-gray{background:#333}input[type=datetime-local]{width:100%;padding:10px;margin-top:10px;border-radius:5px;border:1px solid #444;background:#222;color:#fff}</style></head><body><canvas id="bgCanvas"></canvas><div class="content" id="mainContainer"><h1 id="mainTitle">FALTAM</h1><div id="countdown">00d:00h:00m:00s</div><p id="subTitle">para a virada do Ano!</p><br><a href="#" id="openModal" style="color:#4b92f3;text-decoration:none;font-size:.8rem;opacity:.3">⚙️ CONFIG</a></div><div id="modal" class="modal"><div class="modal-content"><h3 style="margin-bottom:10px">Simular Data</h3><p style="font-size:.8rem;color:#888">Escolha um dia/hora:</p><input type="datetime-local" id="customDateInput" step="1"><button class="btn btn-blue" onclick="manualJump()">Ir para esta data</button><hr style="margin:20px 0;border-top:1px solid #333;border-bottom:none"><button class="btn btn-gray" onclick="TimeMachine.reset()">Voltar Tempo Real</button><button class="btn btn-gray" id="closeModal">Fechar</button></div></div><script>let isCelebrating=!1,wasCelebrating=!1;const canvas=document.getElementById("bgCanvas"),ctx=canvas.getContext("2d");let particles=[];function resize(){canvas.width=window.innerWidth,canvas.height=window.innerHeight}window.onresize=resize,resize();class Particle{constructor(){this.init()}init(){this.x=Math.random()*canvas.width,this.y=Math.random()*canvas.height,this.size=20*Math.random()+5,this.speedY=.6*Math.random()+.2,this.hue=360*Math.random()}update(){let e=isCelebrating?20*this.speedY:this.speedY;this.y-=e,this.y<-50&&(this.y=canvas.height+50),this.hue+=.5}draw(){const e=isCelebrating?.8:.3;ctx.fillStyle=`hsla(${this.hue}, 80%, 60%, ${e})`,ctx.beginPath(),ctx.arc(this.x,this.y,this.size,0,2*Math.PI),ctx.fill()}}for(let e=0;e<70;e++)particles.push(new Particle);function anim(){ctx.clearRect(0,0,canvas.width,canvas.height),particles.forEach((e=>{e.update(),e.draw()})),requestAnimationFrame(anim)}anim();const TimeMachine={offset:0,getNow(){return new Date(Date.now()+this.offset)},jumpTo(e){const t=new Date(e).getTime();isNaN(t)?alert("Data inválida!"):(this.offset=t-Date.now(),document.getElementById("modal").style.display="none")},reset(){this.offset=0,document.getElementById("modal").style.display="none"}};function manualJump(){const e=document.getElementById("customDateInput").value;e&&TimeMachine.jumpTo(e)}function update(){const e=TimeMachine.getNow();let t=new Date(e.getFullYear(),0,1,0,0,0);e>=new Date(e.getFullYear(),0,1,0,15,0)&&(t=new Date(e.getFullYear()+1,0,1,0,0,0));const a=t-e;isCelebrating=0===e.getMonth()&&1===e.getDate()&&0===e.getHours()&&e.getMinutes()<15,document.body.classList.toggle("celebrating",isCelebrating);const n=document.getElementById("mainContainer"),i=document.getElementById("mainTitle"),s=document.getElementById("subTitle"),o=document.getElementById("countdown");if(isCelebrating)wasCelebrating||(n.classList.add("pop-in"),n.classList.add("celebration-active"),wasCelebrating=!0),i.textContent="FELIZ ANO NOVO!",s.textContent="É, bateu a hora. Um feliz Ano Novo para você e que tudo de certo para você.",o.style.display="none";else{wasCelebrating&&(n.classList.remove("pop-in"),n.classList.remove("celebration-active"),wasCelebrating=!1),i.textContent="FALTAM",s.textContent="para a virada do Ano!",o.style.display="block";const e=Math.max(0,a),t=Math.floor(e/864e5),l=String(Math.floor(e%864e5/36e5)).padStart(2,"0"),c=String(Math.floor(e%36e5/6e4)).padStart(2,"0"),d=String(Math.floor(e%6e4/1e3)).padStart(2,"0");o.textContent=`${t}d:${l}h:${c}m:${d}s`,o.setAttribute("data-ms","."+Math.floor(e%1e3/100))}requestAnimationFrame(update)}document.getElementById("openModal").onclick=e=>{e.preventDefault(),document.getElementById("modal").style.display="block"},document.getElementById("closeModal").onclick=()=>document.getElementById("modal").style.display="none",update();</script></body></html>

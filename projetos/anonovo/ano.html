<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feliz Ano Novo!</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css?family=Roboto+Mono:400,700&text=dhms1234567890:" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,-apple-system-ui,Arial,sans-serif;text-align:center;background-color:#000;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;padding:1rem;background:#000;background:-webkit-linear-gradient(152deg,#000 1%,#4d4b4b);background:-moz-linear-gradient(152deg,#000 1%,#4d4b4b 100%);background:linear-gradient(152deg,#000 1%,#4d4b4b);user-select:none}h1{font-size:clamp(2rem,5vw,2.8rem);font-weight:100;margin-bottom:1rem}#countdown{font-optical-sizing:auto}#currentDate{margin-top:1rem}#currentDate,#nextYear{font-size:clamp(1rem,3vw,1.5rem)}#nextYear{margin-top:.5rem}.happy-new-year:after{content:"🎆 Feliz Ano Novo! 🎉";display:block;font-size:clamp(2rem,6vw,3rem);font-weight:700;color:gold;margin-top:1rem}#countdown{font-family:Roboto Mono,monospace;font-weight:700;font-size:clamp(2rem,10vw,4.5rem);color:#000;-webkit-text-stroke:2px red;animation:outlineColor 3s linear infinite}@keyframes outlineColor{0%{-webkit-text-stroke:2px red}25%{-webkit-text-stroke:2px orange}50%{-webkit-text-stroke:2px #ff0}75%{-webkit-text-stroke:2px #0f0}to{-webkit-text-stroke:2px red}}a{color:#4b92f3}.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;overflow:auto;background-color:rgba(0,0,0,.6)}.modal-content{background-color:#555;color:#fff;margin:10% auto;padding:20px;border-radius:8px;width:80%;max-width:400px;animation:fadeIn .3s ease}.close{color:#aaa;float:right;font-size:28px;cursor:pointer}.close:hover{color:#000}@keyframes fadeIn{0%{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}</style></head><body><h1>FALTAM</h1><div id="countdown">carregando...</div><p>para a virada do Ano!</p><div id="currentDate">carregando...</div><div id="nextYear">carregando...</div><small><a href="#" id="openModal">Sobre</a></small><div id="modal" class="modal"><div class="modal-content"><span id="closeModal" class="close">&times;</span><p>Contagem regressiva de Ano Novo por João Lucas (<a href="https://github.com/JoaoLucas1682" target="_blank" rel="noopener noreferrer">GitHub: JoaoLucas1682</a>)</p><br><p>Última modificação: 4/12/2025</p></div></div><script>var _flag_dontexecute2times=!1;const modal=document.getElementById("modal"),openBtn=document.getElementById("openModal"),closeBtn=document.getElementById("closeModal");function updateCountdown(){const e=new Date,t=new Date(e.getFullYear()+1,0,1),n=e.getFullYear()+1,o=t-e,l=Math.floor(o/864e5),d=Math.floor(o%864e5/36e5),a=Math.floor(o%36e5/6e4),c=Math.floor(o%6e4/1e3),i=document.getElementById("countdown");document.getElementById("nextYear").textContent=`✨ Ano Novo: ${n} ✨`,o<0?(i.textContent="",i.classList.add("happy-new-year"),document.getElementById("currentDate").textContent=`📅 Hoje: ${e.toLocaleDateString()} ⏳ ${e.toLocaleTimeString()}`):(i.textContent=`${l}d:${d}h:${a}m:${c}s`,document.getElementById("currentDate").textContent=`📅 Hoje: ${e.toLocaleDateString()} ⏳ ${e.toLocaleTimeString()}`)}function tick(){const e=new Date;updateCountdown();let t=1e3-e.getMilliseconds();(t<50||t>950)&&(t=1e3),setTimeout(tick,t)}function initall(){1!=_flag_dontexecute2times&&(_flag_dontexecute2times=!0,openBtn.addEventListener("click",(()=>{modal.style.display="block"})),closeBtn.addEventListener("click",(()=>{modal.style.display="none"})),window.addEventListener("click",(e=>{e.target===modal&&(modal.style.display="none")})),tick())}tick(),"loading"===document.readyState?document.addEventListener("DOMContentLoaded",initall):initall();</script></body></html>

<title>Countdown 4 OBS</title><style>body{margin:0;padding:0;background:0 0;color:#fff;font-size:120%}.countdown{font-weight:700}</style></head><body><div class="countdown">Carregando...</div><script>const params=new URLSearchParams(window.location.search),mode=params.get("mode")||"tick",fontFamily=params.get("font")||"Segoe UI, Arial, sans-serif";function updateCountdown(){const t=new Date,e=new Date(t.getFullYear()+1,0,1)-t,o=`${String(t.getDate()).padStart(2,"0")}/${String(t.getMonth()+1).padStart(2,"0")}/${t.getFullYear()} ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}:${String(t.getSeconds()).padStart(2,"0")}`,n=document.querySelector(".countdown");if(e<=0)return void(n.innerHTML=`🎆 Feliz Ano Novo! 🎉 - ${o}`);const a=Math.floor(e/864e5),r=Math.floor(e%864e5/36e5),i=Math.floor(e%36e5/6e4),d=Math.floor(e%6e4/1e3);n.innerHTML=`${a}d:${r}h:${i}m:${d}s - ${o}`}function tick(){updateCountdown();const t=1e3-(new Date).getMilliseconds();setTimeout(tick,t)}document.body.style.fontFamily=fontFamily,"tick"===mode?tick():(updateCountdown(),setInterval(updateCountdown,1e3));const fontSize=params.get("fontsize")||"120%";document.body.style.fontSize=fontSize;</script></body></html>

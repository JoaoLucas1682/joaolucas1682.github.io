<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Consulta à API da Páscoa</title><style>body{font-family:sans-serif;padding:2rem;background:#f9f9f9}h1{color:#333}button,input{padding:.5rem;font-size:1rem;margin-right:.5rem}.resultado{margin-top:1rem;background:#fff;padding:1rem;border-radius:8px;box-shadow:0 0 5px #ccc}.erro{color:red}</style></head><body><h1>Consulta à API da Páscoa</h1><label for="ano">Ano:</label><input type="number" id="ano" value="2025" min="1"><button onclick="consultarPascoa()">Consultar</button><div class="resultado" id="resultado"></div><script>async function consultarPascoa(){const e=document.getElementById("ano").value,n=document.getElementById("resultado");n.innerHTML="⏳ Consultando...";try{const r=await fetch(`https://easterapi-v1.joaolds.workers.dev/?y=${e}`),o=await r.json();if(o.error)return void(n.innerHTML=`<p class="erro">Erro: ${o.error}</p>`);n.innerHTML=`\n          <h2>📅 Resultados para ${o.year||o.processedYear}</h2>\n          <ul>\n            <li><strong>Computus:</strong> ${o.computus}</li>\n            <li><strong>DevMedia:</strong> ${o.devMedia}</li>\n            <li><strong>Meeus/Jones/Butcher:</strong> ${o.meeusJonesButcher}</li>\n            <li><strong>Simples:</strong> ${o.simple}</li>\n            <li><strong>Tabela:</strong> ${o.table}</li>\n          </ul>\n        `}catch(r){n.innerHTML='<p class="erro">Erro ao consultar a API.</p>'}}</script></body></html>

<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><title>Microsoft Store DataCollector</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><style>:root{--bg:#05070a;--box:#0f172a;--input-bg:#1e293b;--text-main:#f1f5f9;--text-dim:#94a3b8;--accent:#38bdf8;--accent-glow:rgba(56,189,248,0.4);--border:#334155}body{font-family:Segoe UI,system-ui,sans-serif;background-color:var(--bg);color:var(--text-main);display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}.wrapper{width:100%;max-width:800px}h1{font-size:2.8rem;margin:0;color:var(--text-main);text-shadow:0 10px 20px rgba(0,0,0,.8),0 0 15px var(--accent-glow)}h1,p.intro{text-align:center}p.intro{color:var(--text-dim);margin:10px 0 30px;font-size:1.1rem}.main-box{background:var(--box);border:1px solid var(--border);border-radius:24px;padding:40px;box-shadow:0 25px 50px -12px rgba(0,0,0,.7)}.input-group{display:flex;background:var(--input-bg);border-radius:12px;padding:5px;border:1px solid var(--border);margin-bottom:30px;gap:8px;align-items:stretch}input{flex:1;min-width:50px;background:0 0;border:none;color:#fff;padding:12px;font-size:1rem;outline:0}select{background:#0f172a;border:1px solid var(--border);color:var(--accent);border-radius:8px;padding:0 10px;outline:0;font-size:.85rem}button.search-btn,select{cursor:pointer;font-weight:700}button.search-btn{background:var(--accent);color:#000;border:none;padding:0 25px;border-radius:10px;transition:.3s;white-space:nowrap}button.search-btn:hover{box-shadow:0 0 20px var(--accent-glow);transform:scale(1.02)}.app-card{display:none;animation:fadeIn .5s ease}.header-info{display:flex;gap:25px;align-items:center;margin-bottom:30px}.icon-img{width:120px;height:120px;border-radius:20px;box-shadow:0 10px 20px rgba(0,0,0,.4)}.desc{color:var(--text-dim);line-height:1.6;margin:20px 0;font-size:.95rem;border-top:1px solid var(--border);padding-top:20px;max-height:250px;overflow-y:auto}.endpoi ,{code:"zh-sg",label:"ZH-SG"},{code:"zh-tw",label:"ZH-TW"}];function initSelectors(){const e=document.getElementById("mkt"),t=document.getElementById("lang");availableMarkets.sort().forEach((t=>{let l=document.createElement("option");l.value=t,l.innerText=t,"BR"===t&&(l.selected=!0),e.appendChild(l)})),availableLanguages.sort(((e,t)=>e.label.localeCompare(t.label))).forEach((e=>{let l=document.createElement("option");l.value=e.code,l.innerText=e.label,"pt-br"===e.code&&(l.selected=!0),t.appendChild(l)}))}initSelectors();let currentAppImages=[],lastJsonData=null;async function fetchFullData(){const e=document.getElementById("pId").value.trim(),t=document.getElementById("mkt").value,l=document.getElementById("lang").value;if(!e)return alert("Por favor, insira um Product ID.");const o=`https://displaycatalog.mp.microsoft.com/v7/products/${e}?market=${t}&languages=${l}`;document.getElementById("loading").style.display="block",document.getElementById("appCard").style.display="none";try{const l=await fetch("https://cw-proxy.joaolds.workers.dev/?cors=true&url="+encodeURIComponent(o)),a=await l.json();if(!a.Product)throw new Error("Não encontrado.");lastJsonData=a;const n=a.Product,c=n.LocalizedProperties[0];document.getElementById("appName").innerText=c.ProductTitle,document.getElementById("appDev").innerText=n.Properties.PublisherDisplayName||"Microsoft Corporation",document.getElementById("appDesc").innerText=c.ProductDescription;const d=c.Images.find((e=>"Logo"===e.ImagePurpose))||c.Images[0];document.getElementById("appIcon").src="https:"+d.Uri,currentAppImages=c.Images;const r=`https://get.microsoft.com/installer/download/${e}?referrer=1682MSStoreurlGenLink&source=joaolucas1682.github.io/`,s=`ms-windows-store://pdp?productid=${e}&mode=full&market=${t}`;document.getElementById("urlExe").innerText=r,document.getElementById("urlExe").href=r,document.getElementById("urlStore").innerText=s,document.getElementById("urlStore").href=s,document.getElementById("appCard").style.display="block"}catch(e){alert("Erro ao coletar dados.")}finally{document.getElementById("loading").style.display="none"}}async function downloadAllImages(){if(!currentAppImages.length)return;const e=new JSZip,t=document.getElementById("btnZip");t.innerText="Compactando...";for(let t=0;t<currentAppImages.length;t++){const l=currentAppImages[t];try{const o=await fetch("https:"+l.Uri).then((e=>e.blob())),a=l.Uri.split(".").pop().split("?")[0]||"png";e.file(`asset_${t}_${l.ImagePurpose}.${a}`,o)}catch(e){}}e.generateAsync({type:"blob"}).then((function(e){const l=document.createElement("a");l.href=URL.createObjectURL(e),l.download=`assets_${document.getElementById("pId").value}.zip`,l.click(),t.innerText="Baixar as imagens (screenshots, ícones...)"}))}function downloadMetadataJSON(){if(!lastJsonData)return;const e=`metadata_${document.getElementById("pId").value}.json`,t=new Blob([JSON.stringify(lastJsonData,null,4)],{type:"application/json"}),l=URL.createObjectURL(t),o=document.createElement("a");o.href=l,o.download=e,o.click()}</script></body></html>

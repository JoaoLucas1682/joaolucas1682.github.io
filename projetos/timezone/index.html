<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relógio Dinâmico</title><style>body{font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background-color:#222;color:#fff}.clock-container{text-align:center;font-size:24px;font-weight:700;padding:10px;background-color:#333;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,.5);margin-top:10px}.controls{margin-top:20px}</style></head><body><div class="controls"><label for="timezone">Escolha uma Região:</label><select id="timezone" onchange="atualizarRelogio()"><option value="UTC">Tempo Universal Coordenado (UTC)</option><option value="America/New_York">Nova York (EUA) - Eastern Time (ET)</option><option value="America/Los_Angeles">Los Angeles (EUA) - Pacific Time (PT)</option><option value="America/Sao_Paulo" selected="selected">São Paulo (Brasil) - Brasília Time (BRT)</option><option value="Europe/London">Londres (Reino Unido) - Greenwich Mean Time (GMT)</option><option value="Europe/Paris">Paris (França) - Central European Time (CET)</option><option value="Asia/Tokyo">Tóquio (Japão) - Japan Standard Time (JST)</option><option value="Asia/Shanghai">Pequim (China) - China Standard Time (CST)</option><option value="Asia/Dubai">Dubai (Emirados Árabes) - Gulf Standard Time (GST)</option><option value="Asia/Kolkata">Nova Déli (Índia) - Indian Standard Time (IST)</option><option value="Europe/Moscow">Moscou (Rússia) - Moscow Standard Time (MSK)</option><option value="Africa/Johannesburg">Cidade do Cabo (África do Sul) - South Africa Standard Time (SAST)</option><option value="Australia/Sydney">Sydney (Austrália) - Australian Eastern Standard Time (AEST)</option><option value="America/Mexico_City">Cidade do México (México) - Central Time (CT)</option><option value="America/Argentina/Buenos_Aires">Buenos Aires (Argentina) - Argentina Time (ART)</option><option value="Pacific/Honolulu">Honolulu (Havaí, EUA) - Hawaii-Aleutian Time (HAST)</option><option value="Africa/Nairobi">Nairobi (Quênia) - East Africa Time (EAT)</option><option value="Pacific/Auckland">Auckland (Nova Zelândia) - New Zealand Standard Time (NZST)</option><option value="Pacific/Fiji">Fiji - Fiji Standard Time (FJT)</option><option value="America/Anchorage">Anchorage (Alasca, EUA) - Alaska Standard Time (AKST)</option><option value="America/Phoenix">Phoenix (EUA) - Mountain Standard Time (MST, sem horário de verão)</option><option value="America/Denver">Denver (EUA) - Mountain Time (MT)</option><option value="America/Toronto">Toronto (Canadá) - Eastern Time (ET)</option><option value="America/Vancouver">Vancouver (Canadá) - Pacific Time (PT)</option><option value="America/Bogota">Bogotá (Colômbia) - Colombia Time (COT)</option><option value="America/Lima">Lima (Peru) - Peru Time (PET)</option><option value="America/Caracas">Caracas (Venezuela) - Venezuela Time (VET)</option><option value="Asia/Jakarta">Jacarta (Indonésia) - Western Indonesia Time (WIB)</option><option value="Asia/Seoul">Seul (Coreia do Sul) - Korea Standard Time (KST)</option><option value="Asia/Hong_Kong">Hong Kong (China) - Hong Kong Time (HKT)</option><option value="Africa/Cairo">Cairo (Egito) - Eastern European Time (EET)</option><option value="Pacific/Tongatapu">Nuku'alofa (Tonga) - Tonga Time (TOT)</option><option value="Atlantic/Azores">Açores (Portugal) - Azores Time (AZOT)</option><option value="Etc/GMT">Greenwich Mean Time (GMT)</option><option value="Etc/GMT+0">GMT+0</option><option value="Etc/GMT+1">GMT+1</option><option value="Etc/GMT+2">GMT+2</option><option value="Etc/GMT+3">GMT+3</option><option value="Etc/GMT+4">GMT+4</option><option value="Etc/GMT+5">GMT+5</option><option value="Etc/GMT+6">GMT+6</option><option value="Etc/GMT+7">GMT+7</option><option value="Etc/GMT+8">GMT+8</option><option value="Etc/GMT+9">GMT+9</option><option value="Etc/GMT+10">GMT+10</option><option value="Etc/GMT+11">GMT+11</option><option value="Etc/GMT+12">GMT+12</option><option value="Etc/GMT+13">GMT+13</option><option value="Etc/GMT+14">GMT+14</option><option value="Etc/GMT-1">GMT-1</option><option value="Etc/GMT-2">GMT-2</option><option value="Etc/GMT-3">GMT-3</option><option value="Etc/GMT-4">GMT-4</option><option value="Etc/GMT-5">GMT-5</option><option value="Etc/GMT-6">GMT-6</option><option value="Etc/GMT-7">GMT-7</option><option value="Etc/GMT-8">GMT-8</option><option value="Etc/GMT-9">GMT-9</option><option value="Etc/GMT-10">GMT-10</option><option value="Etc/GMT-11">GMT-11</option><option value="Etc/GMT-12">GMT-12</option><option value="Etc/GMT-13">GMT-13</option><option value="Etc/Zulu">Zulu Time (equivalente a UTC)</option><option value="Etc/UCT">Universal Coordinated Time (UCT, variante de UTC)</option><option value="Etc/Universal">Universal Time (variante de UTC)</option><option value="Etc/Greenwich">Greenwich Time (similar a GMT)</option></select></div><div class="clock-container" id="clock"></div><script>function atualizarRelogio(){let t=document.getElementById("timezone").value,e=new Date,i={hour:"2-digit",minute:"2-digit",second:"2-digit",fractionalSecondDigits:3,timeZone:t},n=new Intl.DateTimeFormat("pt-BR",i).format(e),o={day:"2-digit",month:"2-digit",year:"numeric",timeZone:t},a=new Intl.DateTimeFormat("pt-BR",o).format(e);document.getElementById("clock").innerHTML=`📍 <b>${t}</b><br>🕰 ${n}<br>📆 ${a}`}setInterval(atualizarRelogio,50);</script></body></html>
